<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .card { opacity: 0; transform-box: fill-box; transform-origin: center bottom;
            animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .num  { opacity: 0; transform-box: fill-box; transform-origin: center;
            animation: pop .7s cubic-bezier(.3,1.6,.5,1) forwards; }
    .c1{animation-delay:.1s}.c2{animation-delay:.35s}.c3{animation-delay:.6s}.c4{animation-delay:.85s}
    .n1{animation-delay:.6s}.n2{animation-delay:.85s}.n3{animation-delay:1.1s}.n4{animation-delay:1.35s}
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes rise { from {opacity:0; transform: translateY(30px) scaleY(.6);} to {opacity:1; transform: none;} }
    @keyframes pop  { from {opacity:0; transform: scale(.2);} to {opacity:1; transform: scale(1);} }
    @keyframes glow { 0%,100% {stroke-opacity:.45;} 50% {stroke-opacity:1;} }
  </style>

  <g class="card c1">
    <rect x="10" y="15" width="200" height="120" rx="16" fill="#0d1117" stroke="url(#g)" stroke-width="2" class="glow"/>
    <text class="num n1" x="110" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="url(#g)">5+</text>
    <text x="110" y="110" text-anchor="middle" font-size="15" fill="#c9d1d9">Years Total Exp.</text>
  </g>
  <g class="card c2">
    <rect x="235" y="15" width="200" height="120" rx="16" fill="#0d1117" stroke="url(#g)" stroke-width="2" class="glow"/>
    <text class="num n2" x="335" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="url(#g)">4+</text>
    <text x="335" y="110" text-anchor="middle" font-size="15" fill="#c9d1d9">Years Relevant Exp.</text>
  </g>
  <g class="card c3">
    <rect x="460" y="15" width="200" height="120" rx="16" fill="#0d1117" stroke="url(#g)" stroke-width="2" class="glow"/>
    <text class="num n3" x="560" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="url(#g)">2</text>
    <text x="560" y="110" text-anchor="middle" font-size="15" fill="#c9d1d9">GenAI Projects Shipped</text>
  </g>
  <g class="card c4">
    <rect x="685" y="15" width="200" height="120" rx="16" fill="#0d1117" stroke="url(#g)" stroke-width="2" class="glow"/>
    <text class="num n4" x="785" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="url(#g)">RAG</text>
    <text x="785" y="110" text-anchor="middle" font-size="15" fill="#c9d1d9">Built From Scratch</text>
  </g>
</svg>
